site_name: 梦瑶的研究部落格
theme:
  name: material
  logo: mengyao.jpg
  favicon: mengyao.jpg
  features:
    - navigation.tabs
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/lightbulb-outline
        name: 切换深色模式
    - scheme: slate
      toggle:
        icon: material/lightbulb
        name: 切换浅色模式
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Introduction: intro.md
  - Journals: journals.md
  - Conferences: conferences.md
  - Datasets: datasets.md
  - Reports & Books: reports.md
  - Research Papers:
      - Genetics: papers/genetics.md
      - Early Detection: papers/early-detection.md
      - Interventions: papers/interventions.md
      - AI & Digital Health: papers/ai.md
extra_css:
  - extra.css
